<!DOCTYPE html>

<html>

<head>
    <title>Home</title>
</head>

<body>

    <h1>Home Page</h1>

    {% if request.user.is_authenticated %}

        <h2>
            Welcome {{ request.user.name }}
        </h2>

        <p>
            Email: {{ request.user.email }}
        </p>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <br><br>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

</body>

</html>
