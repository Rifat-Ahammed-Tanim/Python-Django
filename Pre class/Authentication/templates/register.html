<!DOCTYPE html>

<html>

<head>
    <title>Register</title>
</head>

<body>

    <h1>Register</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>
