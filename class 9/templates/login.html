<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      
      .login-container {
        width: 400px;
        background: white;
        padding: 35px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      
      .login-container h2 {
        text-align: center;
        margin-bottom: 8px;
        color: #222;
      }
      
      .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
        font-size: 14px;
      }
      
      .form-group {
        margin-bottom: 18px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
      }
      
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
        transition: 0.2s;
      }
      
      .form-group input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
      }
      
      .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 14px;
      }
      
      .remember {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      
      .remember input {
        cursor: pointer;
      }
      
      .forgot-password {
        color: #2563eb;
        text-decoration: none;
      }
      
      .forgot-password:hover {
        text-decoration: underline;
      }
      
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
      }
      
      .login-btn:hover {
        background: #1d4ed8;
      }
      
      .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #555;
      }
      
      .register-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
      }
      
      .register-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Welcome Back</h2>

      <p class="subtitle">Login to your account</p>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="email">Email</label>

          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <div class="options">
          <label class="remember"><input type="checkbox" name="remember" />Remember me</label>

          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Create an account</a>
      </div>
    </div>
  </body>
</html>
