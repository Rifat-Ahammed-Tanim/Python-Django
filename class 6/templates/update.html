<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Update Student</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-warning">
              <h4 class="mb-0">Update Student</h4>
            </div>

            <div class="card-body">
              <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Name -->
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>

                  <input type="text" name="name" id="name" class="form-control" value="{{ student.name }}" required />
                </div>

                <!-- Age -->
                <div class="mb-3">
                  <label for="age" class="form-label">Age</label>

                  <input type="number" name="age" id="age" class="form-control" value="{{ student.age }}" required />
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>

                  <input type="email" name="email" id="email" class="form-control" value="{{ student.email }}" required />
                </div>

                <!-- Current Image -->
                <div class="mb-3">
                  <label class="form-label">Current Profile Image</label>

                  <br />

                  {% if student.profile_image %}
                    <img src="{{ student.profile_image.url }}" alt="{{ student.name }}" width="100" height="100" class="rounded-circle mb-2" style="object-fit: cover;" />
                  {% else %}
                    <p class="text-muted">No image uploaded</p>
                  {% endif %}
                </div>

                <!-- New Profile Image -->
                <div class="mb-3">
                  <label for="profile_image" class="form-label">Change Profile Image</label>

                  <input type="file" name="profile_image" id="profile_image" class="form-control" accept="image/*" />

                  <small class="text-muted">Leave empty if you don't want to change the image.</small>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-warning">Update Student</button>

                  <a href="{% url 'read' %}" class="btn btn-secondary">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
